# This file defines prompts with defaults for dbt initializaton.
# It is used when the `dbt init` command is invoked.
#
fixed:
  type: databricks
prompts:
  host:
    default: dbc-cc21e849-ca2a.cloud.databricks.com
  token:
    hint: 'personal access token to use, dapiXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX'
    hide_input: true
  http_path:
    hint: 'HTTP path of SQL warehouse to use'
    default: /sql/1.0/warehouses/c2a5ecbfd978e48c
  catalog:
    hint: 'initial catalog'
    default: bronze
  schema:
    hint: 'YOUR personal schema (lower case name, letters/digits/_ only) where dbt builds your objects, example: olivier_hurni'
  threads:
    hint: 'threads to use during development, 1 or more'
    type: 'int'
    default: 4
