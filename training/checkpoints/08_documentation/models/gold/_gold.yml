version: 2

models:
  - name: dim_date
    description: Calendar dimension, one row per day (2024-2028), generated with `dbt_utils.date_spine`.
    columns:
      - name: date_day
        description: The calendar date (primary key).
        data_tests: [unique, not_null]
      - name: season
        description: Meteorological season (winter, spring, summer, autumn).
        data_tests:
          - accepted_values:
              arguments:
                values: ['winter', 'spring', 'summer', 'autumn']

  - name: dim_product
    description: Current product catalog with margin per unit.
    columns:
      - name: product_id
        description: Primary key of the product.
        data_tests: [unique, not_null]
      - name: unit_margin
        description: List price minus unit cost, in CHF.

  - name: dim_store
    description: Stores and online shop.
    columns:
      - name: store_id
        description: Primary key of the store.
        data_tests: [unique, not_null]

  - name: dim_sales_person
    description: Sales persons with the store they currently work in.
    columns:
      - name: sales_person_id
        description: Primary key of the sales person.
        data_tests: [unique, not_null]

  - name: dim_customer
    description: Customers with their country, continent and EU membership from the `countries` seed.
    columns:
      - name: customer_id
        description: Primary key of the customer.
        data_tests: [unique, not_null]
      - name: country_name
        description: Full country name, null if the code is not in the seed.
        data_tests:
          - not_null
      - name: loyalty_tier
        description: '{{ doc("loyalty_tier") }}'

  - name: dim_product_history
    description: One row per version of a product (SCD type 2 built from the `snap_products` snapshot).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [product_id, valid_from]
    columns:
      - name: is_current
        description: True for the latest version of the product.

  - name: dim_sales_person_history
    description: One row per store assignment of a sales person (SCD type 2 built from the `snap_sales_persons` snapshot).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [sales_person_id, valid_from]
    columns:
      - name: is_current
        description: True for the current store assignment.

  - name: fct_sales
    description: >
      Sales fact table, one row per order line. Loaded incrementally (merge on `order_line_id`)
      from the silver order tables; an order that changes in the source (e.g. returned) is merged again.
    columns:
      - name: order_line_id
        description: Primary key of the order line.
        data_tests: [unique, not_null]
      - name: order_id
        description: Order the line belongs to.
        data_tests: [not_null]
      - name: order_day
        description: Calendar date of the order.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: customer_id
        description: Customer, null for anonymous in-store sales.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: store_id
        description: Store or online shop.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_id
      - name: sales_person_id
        description: Sales person, null for online orders.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sales_person')
                field: sales_person_id
      - name: product_id
        description: Product sold.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: order_status
        description: '{{ doc("order_status") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'cancelled', 'returned']
      - name: gross_amount
        description: Quantity times unit price, in CHF, before discount.
      - name: discount_amount
        description: Discount in CHF.
      - name: net_amount
        description: Gross amount minus discount, in CHF (see the `net_amount` macro).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: margin_amount
        description: Net amount minus cost of the goods sold, in CHF.
      - name: order_updated_at
        description: Last change of the order in the source, watermark of the incremental load.

  - name: mart_revenue_by_category_month
    description: Monthly revenue and margin per product category, completed orders only.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [month, category]
    columns:
      - name: net_revenue
        description: Sum of net amounts in CHF.

  - name: mart_store_performance
    description: Monthly revenue, orders and average basket per store, completed orders only.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [month, store_id]

  - name: mart_sales_person_ranking
    description: Sales persons ranked by revenue with the cumulative share of total revenue.
    columns:
      - name: sales_person_id
        data_tests: [unique, not_null]
      - name: cumulative_revenue_share
        description: Share of the total revenue made by this sales person and all better ranked ones.

  - name: mart_revenue_by_country
    description: Revenue by customer country and continent, completed orders only.
    columns:
      - name: country_code
        data_tests: [unique, not_null]
